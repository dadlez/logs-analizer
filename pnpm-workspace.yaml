packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  # Backend
  tsx: ^4
  tsup: ^8
  fastify: ^5
  "@fastify/cors": ^10
  "@fastify/swagger": ^9
  "@fastify/swagger-ui": ^5
  postgres: ^3
  # Frontend
  react: ^19
  react-dom: ^19
  "@mui/material": ^6
  "@emotion/react": ^11
  "@emotion/styled": ^11
  "@tanstack/react-router": ^1
  "@tanstack/react-query": ^5
  "@tanstack/react-table": ^8
  "@vitejs/plugin-react": ^6
  "@vitejs/plugin-react-oxc": ^0.4
  "@types/react": ^19
  "@types/react-dom": ^19
  jsdom: ^26
  msw: ^2
  "@testing-library/react": ^16
  "@testing-library/user-event": ^14
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
